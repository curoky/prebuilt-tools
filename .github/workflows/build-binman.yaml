name: build binman

# Builds the bm client (cmd/binman/, Go) and publishes it to the same
# ghcr registry as the packages, so it can be bootstrapped with a single curl
# and later self-upgraded like any other package.

on:
  push:
    paths:
      - '.github/workflows/build-binman.yaml'
      - 'cmd/binman/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, tag: linux-x86_64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, tag: linux-arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: arm64, tag: darwin-arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      # Statically-linked binary with no host runtime dependencies (CGO off).
      - working-directory: cmd/binman
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go test ./...
          mkdir -p ./binman
          COMMIT="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          COMMIT_DATE="$(git -C "$GITHUB_WORKSPACE" show -s --format=%cI HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_HOST="${RUNNER_OS}/${RUNNER_ARCH} (${{ matrix.runner }})"
          go build -trimpath \
            -ldflags="-s -w \
              -X main.buildCommit=${COMMIT} \
              -X main.buildCommitDate=${COMMIT_DATE} \
              -X main.buildDate=${BUILD_DATE} \
              -X 'main.buildHost=${BUILD_HOST}'" \
            -o ./binman/bm .
          tar -czvf ./binman.${{ matrix.tag }}.tar.gz ./binman

      - uses: oras-project/setup-oras@v2

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - working-directory: cmd/binman
        run: >
          oras push ghcr.io/curoky/standalone-binaries:binman-${{ matrix.tag }}
          ./binman.${{ matrix.tag }}.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
