name: build llvm-tools

on:
  # push:
  #   branches:
  #     - master
  #     - dev
  push:
    paths:
      - '.github/workflows/build-llvm-tools.yaml'
      - 'packages/**'
      - 'manifests/**'
      - 'lib/**'
      - 'cmd/artifact/**'
      - 'cmd/nixcache/install.sh'
      - 'flake*'
  workflow_dispatch:
    inputs:
      name:
        description: 'package name'
        default: ''
        required: false
        type: string
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NIXCACHE_STORE: http://127.0.0.1:37515
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        version:
          - 18
          - 19
          - 20
          - 21
          - 22
    steps:
      - run: echo "skip_steps=true" >> "$GITHUB_ENV"
      - run: echo "skip_steps=false" >> "$GITHUB_ENV"
        if: ${{ (github.event_name == 'schedule') || (github.event_name == 'workflow_dispatch') || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

      - uses: actions/checkout@v5
        if: ${{ env.skip_steps != 'true' }}

      - run: tools/free-disk-space.sh
        if: ${{ env.skip_steps != 'true' }}

      - name: Set up Swap Space
        if: ${{ env.skip_steps != 'true' }}
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 10

      - uses: DeterminateSystems/nix-installer-action@main
        if: ${{ env.skip_steps != 'true' }}

      # - run: nix flake update
      #   if: ${{ env.skip_steps != 'true' }}

      - name: Start Nix cache
        if: ${{ env.skip_steps != 'true' }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash cmd/nixcache/install.sh --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/nixcache" serve > "$RUNNER_TEMP/nixcache.log" 2>&1 &
          curl --retry 30 --retry-delay 1 --retry-connrefused -fsS \
            "$NIXCACHE_STORE/nix-cache-info" || {
              cat "$RUNNER_TEMP/nixcache.log"
              exit 1
            }

      - run: |
          # Both outputs come from one multi-output derivation, so the second
          # build reuses the artifact assembly performed by the first.
          nix build \
            --option extra-substituters "$NIXCACHE_STORE" \
            --option require-sigs false \
            .#clang-tools-${{ matrix.version }} --out-link standalone
          nix build \
            --option extra-substituters "$NIXCACHE_STORE" \
            --option require-sigs false \
            .#tarballs.x86_64-linux.clang-tools-${{ matrix.version }} --out-link tarball
          cp -L tarball ./clang-tools-${{ matrix.version }}.linux-x86_64.tar.gz
        if: ${{ env.skip_steps != 'true' }}

      - name: Push Nix closure to GHCR
        if: ${{ env.skip_steps != 'true' }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXCACHE_PACKAGE_KEY: clang-tools-${{ matrix.version }}
        run: '"$RUNNER_TEMP/bin/nixcache" push "$(readlink -f ./standalone)"'

      - uses: oras-project/setup-oras@v1
        if: ${{ env.skip_steps != 'true' }}

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin
        if: ${{ env.skip_steps != 'true' }}

      - run: >
          oras push ghcr.io/curoky/standalone-binaries:clang-tools-${{ matrix.version }}-linux-x86_64
          ./clang-tools-${{ matrix.version }}.linux-x86_64.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
        if: ${{ env.skip_steps != 'true' }}
