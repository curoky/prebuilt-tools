name: build darwin

on:
  push:
    paths:
      - '.github/workflows/build-darwin.yaml'
      - 'packages/**'
      - 'manifests/**'
      - 'lib/**'
      - 'cmd/artifact/**'
      - 'flake*'
  workflow_dispatch:
    inputs:
      name:
        description: 'package name (use "*" to force build all)'
        default: ''
        required: false
        type: string
      skip_discover:
        description: 'skip binary-cache check and force build the candidate packages'
        default: false
        required: false
        type: boolean
  schedule:
    - cron: '0 0 * * 0'

env:
  NIXCACHE_STORE: http://127.0.0.1:37515
  # Cross-platform packages that are exposed on darwin but fail to build there;
  # excluded so discover never selects them. Linux-only packages are already
  # absent from `.#packages.aarch64-darwin` (filtered by their manifest
  # `platforms` / the localPackages.linux split), so they don't need listing.
  # Space-separated.
  EXCLUDE_PKGS: >-
    inetutils gnupg music-decrypto

jobs:
  discover:
    # Trigger behavior is documented in docs/release-model.md.
    # Skipped entirely when workflow_dispatch requests a specific package.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.name != '' && inputs.name != '*') }}
    runs-on: macos-26
    permissions:
      contents: read
      packages: read
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
      candidates: ${{ steps.set.outputs.candidates }}
      hits: ${{ steps.set.outputs.hits }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@main

      # GNU grep provides `grep -P` (PCRE) and GNU findutils provides
      # `xargs -d`; BSD versions on macOS lack these.
      - run: echo "/opt/homebrew/opt/grep/libexec/gnubin" >> "$GITHUB_PATH"
      - run: echo "/opt/homebrew/opt/findutils/libexec/gnubin" >> "$GITHUB_PATH"
      - run: brew install grep findutils

      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          summarize: false

      - name: Start Nix cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash cmd/nixcache/install.sh --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/nixcache" serve > "$RUNNER_TEMP/nixcache.log" 2>&1 &
          curl --retry 90 --retry-delay 1 --retry-all-errors -fsS \
            "$NIXCACHE_STORE/nix-cache-info" || {
              cat "$RUNNER_TEMP/nixcache.log"
              exit 1
            }
          # Forward the serve log to this job's stdout so cache diagnostics
          # (segment listing, index size, narinfo hit/miss) show up in the
          # Actions log instead of being buried in a file only dumped on
          # failure. Like `serve`, the backgrounded `tail` survives past this
          # step until the job ends, covering the later query steps too.
          tail -n +1 -f "$RUNNER_TEMP/nixcache.log" | sed 's/^/[nixcache] /' &

      - id: set
        env:
          EVENT_NAME: ${{ github.event_name }}
          SKIP_DISCOVER: ${{ inputs.skip_discover }}
        run: |
          set -euo pipefail

          # Resolve every package's output path in a single evaluation, producing
          # TSV lines "<name>\t<outPath>" (excluding the "all" / "all-fast"
          # aggregates). Doing this in one `nix eval` avoids one process per
          # package and sidesteps attribute-path escaping issues for names
          # containing dots.
          # shellcheck disable=SC2016
          nix eval --accept-flake-config --raw .#packages.aarch64-darwin --apply '
            pkgs: builtins.concatStringsSep "\n" (
              builtins.filter (s: s != "") (builtins.attrValues (builtins.mapAttrs
                (name: drv:
                  if name == "all" || name == "all-fast" then "" else "${name}\t${drv.outPath}")
                pkgs))
            )
          ' > pkgs.tsv

          # Packages that fail to build on darwin are excluded via EXCLUDE_PKGS
          # (configured at the top-level env).
          for name in $EXCLUDE_PKGS; do
            grep -vP "^${name}\t" pkgs.tsv > pkgs.tsv.tmp && mv pkgs.tsv.tmp pkgs.tsv
          done

          # Query the binary cache in parallel; a cache miss means the package
          # must be rebuilt. Print the name only for misses. Skip the cache
          # check (force-rebuild every candidate) on schedule or skip_discover;
          # see docs/release-model.md.
          #
          # path-info exits non-zero both for a genuine miss (path absent from
          # cache) and for a query failure (serve unreachable, GHCR error). The
          # serve index loads synchronously before nix-cache-info answers, so a
          # ready cache should never be transiently empty; surface stderr so a
          # query failure is not silently misreported as "need build".
          check() {
            local name="${1%%$'\t'*}"
            local out_path="${1#*$'\t'}"
            local err
            if err=$(nix path-info --store "$NIXCACHE_STORE" --option require-sigs false "$out_path" 2>&1 >/dev/null); then
              echo "cache hit : $name" >&2
            else
              if [ -n "$err" ]; then
                echo "need build: $name (path-info: $err)" >&2
              else
                echo "need build: $name" >&2
              fi
              echo "$name"
            fi
          }
          export -f check
          export NIXCACHE_STORE
          if [ "$SKIP_DISCOVER" = "true" ] || [ "$EVENT_NAME" = "schedule" ]; then
            cut -f1 pkgs.tsv > selected.txt
          else
            xargs -P 16 -d '\n' -I {} bash -c 'check "$@"' _ {} < pkgs.tsv > selected.txt
          fi

          # Build a matrix JSON: {"include":[{"name":"foo"},...]}
          matrix=$(nix run nixpkgs#jq -- -R -s -c \
            'split("\n") | map(select(length > 0)) | {include: map({name: .})}' < selected.txt)
          candidates=$(grep -c . pkgs.tsv || true)
          count=$(grep -c . selected.txt || true)
          hits=$((candidates - count))

          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "candidates=$candidates" >> "$GITHUB_OUTPUT"
          echo "hits=$hits" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "selected packages ($count of $candidates candidates, $hits cache hits):"
          cat selected.txt

  build:
    needs: discover
    # Trigger behavior is documented in docs/release-model.md.
    # Run when discover selected packages, or when discover was skipped for a
    # specific requested package.
    if: ${{ always() && needs.discover.result != 'failure' && needs.discover.result != 'cancelled' && ((needs.discover.outputs.count != '0' && needs.discover.outputs.count != '') || (github.event_name == 'workflow_dispatch' && inputs.name != '' && inputs.name != '*')) }}
    runs-on: macos-26
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Discovered matrix, or a single-package matrix when discover was skipped.
      matrix: ${{ needs.discover.result == 'skipped' && fromJSON(format('{{"include":[{{"name":"{0}"}}]}}', inputs.name)) || fromJSON(needs.discover.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          summarize: false

      - name: Start Nix cache
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash cmd/nixcache/install.sh --prefix "$RUNNER_TEMP/bin"
          "$RUNNER_TEMP/bin/nixcache" serve > "$RUNNER_TEMP/nixcache.log" 2>&1 &
          curl --retry 90 --retry-delay 1 --retry-all-errors -fsS \
            "$NIXCACHE_STORE/nix-cache-info" || {
              cat "$RUNNER_TEMP/nixcache.log"
              exit 1
            }
          # Forward the serve log to this job's stdout so cache diagnostics
          # (segment listing, index size, narinfo hit/miss) show up in the
          # Actions log instead of being buried in a file only dumped on
          # failure. Like `serve`, the backgrounded `tail` survives past this
          # step until the job ends, covering the later `nix build` steps too.
          tail -n +1 -f "$RUNNER_TEMP/nixcache.log" | sed 's/^/[nixcache] /' &

      - run: |
          # Both outputs come from one multi-output derivation, so the second
          # build reuses the artifact assembly performed by the first. Nix
          # suffixes non-default output links with the output name.
          nix build \
            --option extra-substituters "$NIXCACHE_STORE" \
            --option require-sigs false \
            .#${{ matrix.name }} --out-link standalone
          nix build \
            --option extra-substituters "$NIXCACHE_STORE" \
            --option require-sigs false \
            .#tarballs.aarch64-darwin.${{ matrix.name }} --out-link tarball
          cp -L tarball-archive ./${{ matrix.name }}.darwin-arm64.tar.gz
          # Pre-artifact source derivation. The standalone output relativizes its
          # contents and drops all store references, so its closure does not
          # include the upstream deps. Build the source separately so its closure
          # can be pushed too, letting later rebuilds substitute upstream deps
          # instead of rebuilding from source.
          nix build \
            --option extra-substituters "$NIXCACHE_STORE" \
            --option require-sigs false \
            .#sources.aarch64-darwin.${{ matrix.name }} --out-link source

      - name: Push Nix closure to GHCR
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NIXCACHE_PACKAGE_KEY: ${{ matrix.name }}
        run: '"$RUNNER_TEMP/bin/nixcache" push "$(readlink -f ./standalone)" "$(readlink -f ./source)"'

      - uses: oras-project/setup-oras@v2

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - run: >
          oras push ghcr.io/curoky/standalone-binaries:${{ matrix.name }}-darwin-arm64
          ./${{ matrix.name }}.darwin-arm64.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip

      # Record this package's outcome so the summary job can aggregate the
      # matrix results. `job.status` reflects whether any earlier step in this
      # matrix leg failed; runs on `always()` so failures are captured too.
      - name: Record build result
        if: always()
        run: |
          mkdir -p build-results
          printf '%s\t%s\n' "${{ matrix.name }}" "${{ job.status }}" \
            > "build-results/${{ matrix.name }}.tsv"

      - name: Upload build result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-result-${{ matrix.name }}
          path: build-results/${{ matrix.name }}.tsv
          retention-days: 7

  summary:
    needs: [discover, build]
    # Always run so the summary is produced even when discover was skipped or
    # some build legs failed; only skip if the whole run was cancelled.
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PLATFORM: aarch64-darwin
      DISCOVER_RESULT: ${{ needs.discover.result }}
      BUILD_RESULT: ${{ needs.build.result }}
      CANDIDATES: ${{ needs.discover.outputs.candidates }}
      HITS: ${{ needs.discover.outputs.hits }}
      SELECTED: ${{ needs.discover.outputs.count }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      # Per-package results are uploaded by each build matrix leg as
      # build-result-<name>; collect them all into one directory. When every
      # candidate was a cache hit the build job is skipped and no such artifact
      # exists; download-artifact@v8 hard-fails with a 404 on an empty pattern
      # match, so only attempt the download when build actually ran.
      - name: Download build results
        if: ${{ needs.build.result != 'skipped' }}
        uses: actions/download-artifact@v8
        with:
          pattern: build-result-*
          path: build-results
          merge-multiple: true

      - name: Render summary
        run: |
          set -euo pipefail

          # flake.lock snapshot: the SHA-256 that identifies the Nix cache
          # segment; short form mirrors nixcache's segment tag.
          snapshot="$(sha256sum flake.lock | cut -c1-16)"

          success=0
          failure=0
          other=0
          declare -a failed_pkgs=()
          shopt -s nullglob
          results=(build-results/*.tsv)
          shopt -u nullglob
          for file in "${results[@]}"; do
            while IFS=$'\t' read -r name status; do
              [ -n "$name" ] || continue
              case "$status" in
                success) success=$((success + 1)) ;;
                failure) failure=$((failure + 1)); failed_pkgs+=("$name") ;;
                *) other=$((other + 1)) ;;
              esac
            done < "$file"
          done
          built_total=$((success + failure + other))

          {
            echo "# build darwin summary"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| platform | \`${PLATFORM}\` |"
            echo "| commit | [\`${GITHUB_SHA:0:12}\`](${{ github.server_url }}/${{ github.repository }}/commit/${GITHUB_SHA}) |"
            echo "| flake.lock snapshot | \`${snapshot}\` |"
            echo "| run | [#${{ github.run_number }}](${RUN_URL}) |"
            echo
            echo "## discover"
            echo
            if [ "$DISCOVER_RESULT" = "skipped" ]; then
              echo "discover was skipped (single-package dispatch)."
            else
              echo "| metric | count |"
              echo "| --- | --- |"
              echo "| candidates | ${CANDIDATES:-0} |"
              echo "| cache hits | ${HITS:-0} |"
              echo "| selected for build | ${SELECTED:-0} |"
            fi
            echo
            echo "## build"
            echo
            echo "job result: \`${BUILD_RESULT}\`"
            echo
            echo "| metric | count |"
            echo "| --- | --- |"
            echo "| built | ${built_total} |"
            echo "| success | ${success} |"
            echo "| failure | ${failure} |"
            if [ "$other" -gt 0 ]; then
              echo "| other | ${other} |"
            fi
            echo
            if [ "$failure" -gt 0 ]; then
              echo "### failed packages"
              echo
              for name in "${failed_pkgs[@]}"; do
                echo "- \`${name}\`"
              done
              echo
              echo "See the [build jobs](${RUN_URL}) for per-package logs."
            fi
          } > "$RUNNER_TEMP/summary.md"

          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          cat "$RUNNER_TEMP/summary.md"
