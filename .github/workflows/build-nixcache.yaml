name: build nixcache

# Builds the nixcache client and publishes it as a regular standalone-binaries
# package. Nix cache contents use the separate standalone-binaries-cache repo.

on:
  push:
    paths:
      - '.github/workflows/build-nixcache.yaml'
      - 'cmd/nixcache/**'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64, tag: linux-x86_64, runner: ubuntu-latest }
          - { goos: linux, goarch: arm64, tag: linux-arm64, runner: ubuntu-24.04-arm }
          - { goos: darwin, goarch: arm64, tag: darwin-arm64, runner: macos-latest }
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: go.sum

      - working-directory: cmd/nixcache
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          go vet ./...
          go test ./...
          mkdir -p ./nixcache
          go build -trimpath -ldflags="-s -w" -o ./nixcache/nixcache .
          tar -czvf ./nixcache.${{ matrix.tag }}.tar.gz ./nixcache

      - uses: oras-project/setup-oras@v2

      - run: echo "${{ secrets.GITHUB_TOKEN }}" | oras login ghcr.io -u ${{ github.actor }} --password-stdin

      - working-directory: cmd/nixcache
        run: >
          oras push ghcr.io/curoky/standalone-binaries:nixcache-${{ matrix.tag }}
          ./nixcache.${{ matrix.tag }}.tar.gz:application/vnd.oci.image.layer.v1.tar+gzip
