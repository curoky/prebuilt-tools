name: Prune Nix Cache

on:
  push:
    paths:
      - '.github/workflows/prune-nix-cache.yaml'
  workflow_dispatch:

jobs:
  cache-prune:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_ACTOR: ${{ github.actor }}
    steps:
      - name: Install nixcache
        run: curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/cmd/nixcache/install.sh | bash -s -- --prefix "$HOME/.local/bin"

      - name: Report cache size before prune
        run: |
          before=$("$HOME/.local/bin/nixcache" size)
          echo "before=$before" >>"$GITHUB_ENV"
          echo "Cache size before prune: $before" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prune old snapshots
        run: $HOME/.local/bin/nixcache prune --keep 2

      - name: Report cache size after prune
        run: |
          after=$("$HOME/.local/bin/nixcache" size)
          echo "Cache size after prune: $after" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Before: ${{ env.before }}" | tee -a "$GITHUB_STEP_SUMMARY"
